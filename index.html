<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Photo 🐯</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; margin: 0; padding-bottom: 110px; }
    .container { max-width: 800px; margin: auto; padding: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    input, button { display: block; width: 100%; margin: 10px 0; padding: 10px; border-radius: 5px; border: none; box-sizing: border-box; }
    button { background: #6366f1; color: white; font-weight: bold; cursor: pointer; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
    .photo-card { background: #334155; border-radius: 8px; overflow: hidden; position: relative; }
    .photo-card img.main-img { width: 100%; height: 200px; object-fit: cover; }
    
    /* Menu à 3 points */
    .menu-options { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); border-radius: 50%; width: 30px; height: 30px; text-align: center; line-height: 30px; cursor: pointer; z-index: 10; }
    .dropdown { display: none; position: absolute; top: 40px; right: 10px; background: #0f172a; border-radius: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 20; }
    .dropdown button { background: #ef4444; margin: 0; padding: 8px 12px; font-size: 0.8em; }

    /* Profil rond fixé en bas */
    .profile-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; border-top: 2px solid #334155; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; z-index: 100; }
    .profile-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid #f97316; cursor: pointer; background: #1e293b; }
    
    /* Panel Admin Popup */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; }
    .modal-content { background: #1e293b; padding: 25px; border-radius: 12px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; border: 1px solid #f97316; }
    .admin-btn { background: #f97316; color: white; width: auto; margin: 0; padding: 8px 14px; font-size: 0.85em; display: flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐯 Studio Photo</h1>

    <!-- Formulaire Authentification -->
    <div id="auth-box" class="card">
      <h2>Connexion / Inscription</h2>
      <input type="email" id="email" placeholder="Adresse Email">
      <input type="password" id="password" placeholder="Mot de passe">
      <input type="text" id="pseudo" placeholder="Pseudo (optionnel)">
      <button onclick="connexion()">Se connecter</button>
      <button onclick="inscription()" style="background:#10b981;">S'inscrire</button>
    </div>

    <!-- Application Principal -->
    <div id="app-box" style="display:none;">
      <div class="card">
        <h3>Publier une photo</h3>
        <input type="file" id="photo-input">
        <label><input type="checkbox" id="private-check" style="display:inline; width:auto;"> Photo privée (Admin & toi uniquement)</label>
        <button onclick="uploadPhoto()">Partager la photo</button>
      </div>

      <h2>Galerie Photos</h2>
      <div id="gallery" class="gallery"></div>
    </div>
  </div>

  <!-- Modal / Popup Panel Admin -->
  <div id="admin-modal" class="modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid #334155; padding-bottom: 10px;">
        <h2 style="margin:0; color:#f97316;">🐯 Panel Administration</h2>
        <button onclick="fermerAdmin()" style="width:auto; background:none; font-size:1.5em; margin:0; padding:0;">✕</button>
      </div>
      <p style="font-size:0.9em; color:#94a3b8;">Liste des utilisateurs inscrits :</p>
      <div id="users-list"></div>
    </div>
  </div>

  <!-- Barre Fixe du Profil en Bas -->
  <div id="profile-bar" class="profile-bar" style="display:none;">
    <div style="display:flex; align-items:center; gap:12px;">
      <img id="my-avatar" class="profile-avatar" src="" onclick="changerAvatar()" title="Changer la photo de profil">
      <div>
        <strong id="my-pseudo" style="display:block; font-size:1em;"></strong>
        <span id="my-role" style="font-size:0.75em; color:#94a3b8;"></span>
      </div>
    </div>
    
    <div style="display:flex; gap:10px; align-items:center;">
      <!-- Bouton Panel Admin visible uniquement par les admins -->
      <button id="btn-admin-panel" class="admin-btn" onclick="ouvrirAdmin()" style="display:none;">
        🐯 Panel Admin
      </button>
      <button onclick="deconnexion()" style="width:auto; background:#dc2626; margin:0; padding:8px 12px;">Déconnexion</button>
    </div>
  </div>

  <script>
    let user = JSON.parse(localStorage.getItem('user'));
    
    // Tête de tigre par défaut en image SVG
    const defaultTigre = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="%23f97316" stroke="%23000" stroke-width="4"/><path d="M 20 20 L 35 35 M 80 20 L 65 35 M 50 10 L 50 28" stroke="%23000" stroke-width="6" stroke-linecap="round"/><circle cx="35" cy="45" r="7" fill="%23000"/><circle cx="65" cy="45" r="7" fill="%23000"/><polygon points="45,58 55,58 50,66" fill="%23000"/><path d="M 35 72 Q 50 82 65 72" stroke="%23000" stroke-width="5" fill="none"/></svg>';

    function renderUI() {
      if (user) {
        document.getElementById('auth-box').style.display = 'none';
        document.getElementById('app-box').style.display = 'block';
        document.getElementById('profile-bar').style.display = 'flex';
        document.getElementById('my-pseudo').innerText = user.pseudo;
        document.getElementById('my-role').innerText = user.role === 'admin' ? '👑 Administrateur' : 'Membre';
        
        // Affichage du bouton admin si rôle admin
        if (user.role === 'admin') {
          document.getElementById('btn-admin-panel').style.display = 'flex';
        } else {
          document.getElementById('btn-admin-panel').style.display = 'none';
        }

        document.getElementById('my-avatar').src = (user.photo_profil && user.photo_profil !== 'tigre.png') 
          ? '/uploads/' + user.photo_profil 
          : defaultTigre;

        chargerPhotos();
      } else {
        document.getElementById('auth-box').style.display = 'block';
        document.getElementById('app-box').style.display = 'none';
        document.getElementById('profile-bar').style.display = 'none';
      }
    }

    async function connexion() {
      const res = await fetch('/api/connexion', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.value, mot_de_passe: password.value })
      });
      if (res.ok) { user = await res.json(); localStorage.setItem('user', JSON.stringify(user)); renderUI(); }
      else alert(await res.text());
    }

    async function inscription() {
      const res = await fetch('/api/inscription', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email.value, mot_de_passe: password.value, pseudo: pseudo.value })
      });
      if (res.ok) alert('Inscription réussie ! Vous pouvez vous connecter.'); 
      else alert(await res.text());
    }

    function deconnexion() { localStorage.removeItem('user'); user = null; renderUI(); }

    async function changerAvatar() {
      const input = document.createElement('input');
      input.type = 'file';
      input.onchange = async () => {
        const formData = new FormData();
        formData.append('avatar', input.files[0]);
        const res = await fetch('/api/avatar', { method: 'POST', headers: { 'user-id': user.id }, body: formData });
        if (res.ok) {
          const data = await res.json();
          user.photo_profil = data.photo_profil;
          localStorage.setItem('user', JSON.stringify(user));
          renderUI();
        }
      };
      input.click();
    }

    async function uploadPhoto() {
      const fileInput = document.getElementById('photo-input');
      if(!fileInput.files[0]) return alert('Sélectionnez une image !');
      
      const formData = new FormData();
      formData.append('photo', fileInput.files[0]);
      formData.append('est_prive', document.getElementById('private-check').checked);

      const res = await fetch('/api/upload', { method: 'POST', headers: { 'user-id': user.id }, body: formData });
      if (res.ok) { fileInput.value = ''; chargerPhotos(); } 
      else alert(await res.text());
    }

    async function chargerPhotos() {
      const res = await fetch('/api/photos', { headers: { 'user-id': user.id } });
      if (!res.ok) return;
      const photos = await res.json();
      
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = photos.map(p => {
        const estAuteurOuAdmin = p.auteur_id === user.id || user.role === 'admin';
        return `
          <div class="photo-card">
            ${estAuteurOuAdmin ? `
              <div class="menu-options" onclick="toggleMenu('${p._id}')">⋮</div>
              <div id="drop-${p._id}" class="dropdown">
                <button onclick="supprimerPhoto('${p._id}')">Supprimer</button>
              </div>
            ` : ''}
            <img src="/uploads/${p.nom_fichier}" class="main-img">
            <div style="padding: 10px;">
              <small>Par : <strong>${p.pseudo}</strong></small>
              ${p.est_prive ? '<span style="color:#ef4444; font-size:0.75em; margin-left:5px;">(Privée)</span>' : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleMenu(id) {
      const el = document.getElementById(`drop-${id}`);
      el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    async function supprimerPhoto(id) {
      if (!confirm('Supprimer cette photo ?')) return;
      await fetch(`/api/photos/${id}`, { method: 'DELETE', headers: { 'user-id': user.id } });
      chargerPhotos();
    }

    // Modal Admin
    async function ouvrirAdmin() {
      document.getElementById('admin-modal').style.display = 'flex';
      const res = await fetch('/api/admin/users', { headers: { 'user-id': user.id } });
      if (res.ok) {
        const users = await res.json();
        document.getElementById('users-list').innerHTML = users.map(u => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #334155;">
            <div>
              <strong>${u.pseudo}</strong> (${u.email})
              <br><small style="color:#94a3b8;">Rôle: ${u.role} | ${u.est_banni ? '🔴 BANNI' : '🟢 Actif'}</small>
            </div>
            ${u._id !== user.id ? `
              <button onclick="bannirUser('${u._id}')" style="width:auto; margin:0; padding:6px 10px; background:${u.est_banni ? '#22c55e' : '#ef4444'};">
                ${u.est_banni ? 'Débannir' : 'Bannir'}
              </button>
            ` : ''}
          </div>
        `).join('');
      }
    }

    function fermerAdmin() {
      document.getElementById('admin-modal').style.display = 'none';
    }

    async function bannirUser(user_id) {
      await fetch('/api/admin/ban', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'user-id': user.id },
        body: JSON.stringify({ user_id })
      });
      ouvrirAdmin();
      chargerPhotos();
    }

    renderUI();
  </script>
</body>
</html>
